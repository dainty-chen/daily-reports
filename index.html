iv class="q-sub">长端失控风险</div></div></div></section><section class="sec"><div class="sec-head"><span class="emoji">₿</span><h2>加密货币</h2></div><p class="empty">今日暂无数据 / 休市</p></section><section class="sec"><div class="sec-head"><span class="emoji">📰</span><h2>今日重大财经事件</h2></div><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">债市风暴：30 年美债升至 2007 年来最高，高盛称美联储或被迫加息</a></h3><p class="ev-sum">债市风暴席卷美欧日，长端国债收益率逼近数十年高点，美国 30 年期国债收益率升至 2007 年以来最高、被指「看起来很像 2007 年」；高盛甚至判断美联储或被迫加息。</p><p class="ev-why"><span class="lbl">影响/解读</span>长端利率失控是当前最大风险——抬高全球融资成本、压制高估值科技/AI 股，是本轮 AI 回调的宏观推手。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">隔夜美股集体收跌，AI 云/存储/光通信回落、多只芯片股跌超 7%</a></h3><p class="ev-sum">8/18 美股纳指 -1.33%、三大指数集体收跌；存储、光通信、AI 云服务板块大幅回落，多只芯片股跌超 7%。</p><p class="ev-why"><span class="lbl">影响/解读</span>连日大涨后 AI 板块获利了结+估值担忧，回调蔓延至亚洲（A股、韩股）。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">黄金 -1.86%、白银 -3.74% 大跌</a></h3><p class="ev-sum">国际金价跌 1.86%、白银跌 3.74%，贵金属从高位明显回调。</p><p class="ev-why"><span class="lbl">影响/解读</span>在美债收益率飙升、美元走强下，无息资产黄金短线承压；但避险与债务担忧仍是中期支撑。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">A股芯片算力齐跌、创业板跌超 4%，韩股大跌 6%</a></h3><p class="ev-sum">今日 A股芯片、算力板块齐跌，创业板指跌超 4%；芯片股抛售蔓延亚洲，韩股大跌 6%。</p><p class="ev-why"><span class="lbl">影响/解读</span>AI/半导体主线短期退潮，高位科技股杀估值；关注量能与超跌反弹机会。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">宇树科技上市首日大涨约 500%，市值超 4400 亿</a></h3><p class="ev-sum">宇树科技科创板上市首日大涨约 500%、市值超 4400 亿元；中一签赚近 50 万、中签率创科创板新低；梁文锋打新浮盈约 11 亿、雷军相关持仓大赚。</p><p class="ev-why"><span class="lbl">影响/解读</span>具身智能/人形机器人狂热，宇树暴涨点燃机器人板块情绪，但需分辨产业价值与投机成分。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">频准激光上市首日 +516.44%，登顶 A股「最赚钱新股」</a></h3><p class="ev-sum">激光赛道新股频准激光科创板上市首日大涨 516.44%，创 A股「最赚钱新股」纪录。</p><p class="ev-why"><span class="lbl">影响/解读</span>打新赚钱效应极强，反映资金对半导体激光/硬科技的高热度。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">硅片价格普涨、18X 硅片涨近 30%</a></h3><p class="ev-sum">硅片价格普遍上涨，18X 硅片涨幅接近 30%，市场成交量放大。</p><p class="ev-why"><span class="lbl">影响/解读</span>上游硅片涨价利好硅片厂商，也印证半导体/光伏需求边际改善（与今日芯片股回调形成基本面 vs 情绪的背离）。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">住房公积金提取条件放宽，9/20 起施行</a></h3><p class="ev-sum">《国务院关于修改住房公积金管理条例的决定》公布，租房、装修等消费情形新增提取渠道，更具普惠性，自 2026/9/20 起施行。</p><p class="ev-why"><span class="lbl">影响/解读</span>利好居民消费与地产链需求，是稳内需的政策信号。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">2026 世界机器人大会本周召开（300+ 企业、2000+ 展品）</a></h3><p class="ev-sum">2026 世界机器人大会 8/19–23 在北京举行，参展企业 300 余家、展品超 2000 件。</p><p class="ev-why"><span class="lbl">影响/解读</span>催化具身智能/机器人主题（叠加宇树上市），是本周产业级看点。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">中报业绩爆发：普冉 +1929%、兆易创新 +1091.5%、天孚 +33.92%</a></h3><p class="ev-sum">普冉股份上半年净利 +1929.65%、兆易创新 +1091.5%、天孚通信 +33.92%；芯原股份 AI 算力新签订单占比达 90%；利亚德、汉朔科技分别收到美国关税退税 1.12 亿、1.57 亿元。</p><p class="ev-why"><span class="lbl">影响/解读</span>存储/光器件/AI 算力相关中报高增，是资金中线主题；关税退税改善部分出口企业利润。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">苹果首次承认反垄断行动冲击 App Store，拖累超 1000 亿美元服务业务</a></h3><p class="ev-sum">苹果首次承认反垄断行动对 App Store 造成冲击，拖累其超过 1000 亿美元的服务业务。</p><p class="ev-why"><span class="lbl">影响/解读</span>苹果服务护城河受监管侵蚀，影响其估值与利润预期，也是全球科技反垄断的风向标。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">利空提示：中国联通 -34.6%、福耀 -17.37%、小米调整后净利 -42.6%</a></h3><p class="ev-sum">中国联通上半年净利 -34.6%、福耀玻璃 -17.37%；贝达药业合作伙伴 DURAVYU 三期试验未达主要终点；小米二季度经调整净利同比 -42.6%（存储等核心器件成本大幅上涨）。</p><p class="ev-why"><span class="lbl">影响/解读</span>个别蓝筹/成长业绩承压，尤其小米受存储涨价拖累——存储超级周期对下游终端是成本压力，需辩证看。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-19/doc-ininuzku8334226.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">台积电疯狂扩产、英伟达 GPU 变相打折、长江存储 IPO 验收</a></h3><p class="ev-sum">台积电疯狂扩产、风险转移给科技巨头；英伟达 GPU 名义未降但已变相「打折」；国产存储龙头长江存储 IPO 辅导状态变更为「辅导验收」。</p><p class="ev-why"><span class="lbl">影响/解读</span>供给端扩张+龙头变相降价，叠加国产存储上市推进，长期利好算力普及与国产替代，但短期加剧价格竞争担忧。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">蚂蚁分拆融资 AI 挂帅、中国首次火箭陆地回收、阿布扎比新进买入 7 家 A股</a></h3><p class="ev-sum">蚂蚁集团启动分拆融资、以 AI 为核心；蓝箭航天实现中国首次火箭陆地回收成功；阿布扎比投资局二季度积极布局中国资产、新进买入 7 家 A股公司。</p><p class="ev-why"><span class="lbl">影响/解读</span>AI 资本化、商业航天突破、外资加码 A股，均为结构性利好信号。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 / 新浪操盘必读 ↗</a></div></article></section>

iv class="q-chg up">创2007来新高</div><div class="q-sub">逼近金融危机高点</div></div><div class="tile"><div class="q-head"><span class="q-name">外资持美债</span></div><div class="q-val">6月减持721亿</div><div class="q-chg down">日本减264亿最多</div><div class="q-sub">美债需求走弱</div></div></div></section><section class="sec"><div class="sec-head"><span class="emoji">₿</span><h2>加密货币</h2></div><p class="empty">今日暂无数据 / 休市</p></section><section class="sec"><div class="sec-head"><span class="emoji">📰</span><h2>今日重大财经事件</h2></div><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">隔夜美股集体收跌，微软、Meta 跌超 3%</a></h3><p class="ev-sum">8/17 美股纳指 -0.32%、道指 -0.51%、标普 -0.52%，微软、Meta 跌超 3%，科技巨头回调拖累指数。</p><p class="ev-why"><span class="lbl">影响/解读</span>在美债收益率飙升+地缘扰动下，高估值科技股承压，市场风险偏好转弱。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">美国 30 年期国债收益率升至 5.29%，创 2007 年来新高</a></h3><p class="ev-sum">美国 30 年期国债收益率升至 5.29%、创 2007 年以来新高、逼近金融危机高点；6 月外国投资者减持美债 721 亿美元，日本减持 264 亿最多。</p><p class="ev-why"><span class="lbl">影响/解读</span>长端利率飙升+外资减持，抬高全球融资成本、压制成长股估值，是当前最需警惕的宏观变量。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">中东紧张、油价大涨：布伦特 +2.7% 至 90.87 美元</a></h3><p class="ev-sum">特朗普表示不寻求延长与伊朗的谅解备忘录，中东局势紧张，布伦特原油涨 2.7% 至 90.87 美元、WTI 涨 2.6% 至 84.50 美元。</p><p class="ev-why"><span class="lbl">影响/解读</span>油价上行推升通胀预期与长端利率，利多能源、利空成本敏感行业，也给降息路径添变数。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">避险升温：现货金 +0.92% 至 4416.6 美元、白银 +1.68%</a></h3><p class="ev-sum">地缘与利率不确定下避险需求上升，现货黄金涨 0.92% 报 4416.6 美元、白银涨 1.68% 报 65.79 美元。</p><p class="ev-why"><span class="lbl">影响/解读</span>贵金属受益于避险+抗通胀，趋势偏强；A股黄金股或跟随。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://www.tradingkey.com/analysis/stocks/more/262111107-japan-stocks-nikkei-softbank-kioxia-tradingkey" target="_blank" rel="noopener">铠侠财报炸裂引爆存储：营收暴增 415%、售价环比 +70%，股价飙约 15%</a></h3><p class="ev-sum">日本 NAND 龙头铠侠（Kioxia）公布 FY2027 一季度（4–6 月）财报：营收 1.77 万亿日元（约 110 亿美元）、同比暴增约 415% 创历史新高，混合销售均价环比上涨 70%，AI 服务器与数据中心/企业级 SSD 需求最强；股价单日飙升约 15%（新浪口径盘中涨超 13%），并带动闪迪涨超 8%，存储/光通信 AI 概念逆势走强。</p><p class="ev-why"><span class="lbl">影响/解读</span>AI 内存进入「量价齐升」超级周期——铠侠+闪迪财报共同印证 NAND 结构性紧缺与涨价，利好存储、HBM、光模块与 A股相关概念（长鑫存储链、封测等）。</p><div class="ev-foot"><a class="src" href="https://www.tradingkey.com/analysis/stocks/more/262111107-japan-stocks-nikkei-softbank-kioxia-tradingkey" target="_blank" rel="noopener">TradingKey / Bloomberg ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">国务院部署稳经济、发改委加码政策性金融工具</a></h3><p class="ev-sum">国务院召开第十二次全体会议，强调做好经济工作、实现「十五五」良好开局；发改委部署加快 2026 年新型政策性金融工具投放、增加对民间投资的支持。</p><p class="ev-why"><span class="lbl">影响/解读</span>稳增长与逆周期政策加码，利好基建、地产链与顺周期板块，提振 A股风险偏好。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">7 月经济数据：工业 +4.5%、社零仅 +0.6%，地产投资 -19.2%</a></h3><p class="ev-sum">7 月规上工业增加值同比 +4.5%（相对平稳）；社会消费品零售 7 月同比仅 +0.6%（消费疲软）；1-7 月房地产开发投资同比 -19.2%；一线城市新房价环比持平、二手房价连涨 5 个月。</p><p class="ev-why"><span class="lbl">影响/解读</span>工业/科技制造强、消费与地产投资弱，经济「冷热不均」——强化对政策进一步发力的预期。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">OpenAI 承诺 2030 年前大规模部署英伟达 AI 基建，涉约 6000 亿美元机遇</a></h3><p class="ev-sum">OpenAI 承诺在 2030 年前大规模部署英伟达 AI 基础设施，涉及约 6000 亿美元的机遇。</p><p class="ev-why"><span class="lbl">影响/解读</span>超级订单锁定长期算力需求，利好英伟达及算力、电力、光模块、存储全链的确定性。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">英伟达 Spectrum-X 硅光（CPO）交换机全面量产</a></h3><p class="ev-sum">英伟达 Spectrum-X 以太网硅光交换机进入全面量产，CPO（共封装光学）技术商用化提速。</p><p class="ev-why"><span class="lbl">影响/解读</span>CPO 从概念走向量产，直接利好光模块、光芯片、先进封装产业链。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">《石油天然气发展「十五五」规划》出台</a></h3><p class="ev-sum">规划明确到 2030 年的供应目标与管道规划，拟启动西气东输四线、五线建设。</p><p class="ev-why"><span class="lbl">影响/解读</span>油气基建加码，利好管道、油服、能源建设产业链。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">宇树科技 8/19 科创板上市（人形机器人第一股）</a></h3><p class="ev-sum">宇树科技将于 8 月 19 日在科创板上市；同时 2026 服贸会将展示「机器人+」消费场景，电磁驱动聚变大科学装置单路脉冲源通过验收。</p><p class="ev-why"><span class="lbl">影响/解读</span>具身智能/机器人+可控核聚变主题受催化，宇树上市或点燃机器人板块情绪。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">中报业绩爆发股：融捷 +1076%、多氟多 +897%、澄星 +533%</a></h3><p class="ev-sum">上半年净利润大增个股：融捷股份 +1076.14%、多氟多 +897.19%、澄星股份 +533.75%、光库科技 +186.09%、中材科技 +21%。</p><p class="ev-why"><span class="lbl">影响/解读</span>锂电材料/磷化工/光器件等中报高增，是资金挖掘的短线主题，需辨别持续性。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">产业投资/并购活跃：光芯片、先进封测、MLCC、光纤</a></h3><p class="ev-sum">大恒科技拟受让中石光芯 5% 股权进军光芯片；盈新发展定增 17.79 亿投先进封测及存储模组；瑞丰高材收购觅拓新材切入电子级环氧树脂；洁美科技追加 4.28 亿扩 MLCC 离型膜产能；日丰股份投 7 亿建光纤预制棒。</p><p class="ev-why"><span class="lbl">影响/解读</span>半导体材料/封测/被动元件/光通信的产业投资密集，印证 AI/电子景气与国产替代主线。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">利空提示：芯原亏损、国晟逾期债务、多家控制权变更停牌</a></h3><p class="ev-sum">芯原股份上半年净亏 6.12 亿；国晟科技下属公司逾期债务 5775 万（占净资产 18.58%）；共进股份关键客户依赖度高；华阳集团、丰原药业筹划控制权变更，相关个股停牌。</p><p class="ev-why"><span class="lbl">影响/解读</span>个别公司基本面/治理风险提示，涉及个股需规避；控制权变更类留意复牌波动。</p><div class="ev-foot"><a class="src" href="https://finance.sina.com.cn/stock/cpbd/2026-08-18/doc-ininssee3566380.shtml" target="_blank" rel="noopener">新浪财经（操盘必读） ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">「最贵新股」频准激光上市首日暴涨约 595%，中一签最高爆赚约 55 万</a></h3><p class="ev-sum">频准激光（半导体激光相关）上市首日暴涨超 500%、约 +595%，创 A股历史纪录，中一签最高爆赚约 55 万元；早盘半导体硅片活跃，A股三大股指小幅低开。</p><p class="ev-why"><span class="lbl">影响/解读</span>打新赚钱效应极强，反映资金对半导体/激光赛道的高热度；但首日暴涨也蕴含高波动风险。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">科技巨头隐藏了约 1.5 万亿美元 AI 债务</a></h3><p class="ev-sum">华尔街见闻报道，科技巨头通过表外等方式隐藏了约 1.5 万亿美元的 AI 相关债务；叠加 AI 发债推升长端利率，市场开始担忧 AI 建设的融资杠杆与泡沫。</p><p class="ev-why"><span class="lbl">影响/解读</span>AI 资本开支的「债务面」浮出水面——若融资成本持续走高，可能放大 AI 板块的估值与信用风险，值得警惕。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">LME 铜库存单月骤降 32%，铜市供需持续失衡</a></h3><p class="ev-sum">伦敦金属交易所（LME）铜库存单月骤降 32%，铜市供需持续失衡。</p><p class="ev-why"><span class="lbl">影响/解读</span>库存快速去化+供需紧张，利多铜价与有色金属板块。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">中国 AI 基础设施「价值洼地」：占全球 85% 算力流量，仅 10% 市场收入</a></h3><p class="ev-sum">华尔街见闻分析指出，中国 AI 基础设施承载了全球约 85% 的算力流量，却只获得约 10% 的市场收入，存在明显的「价值洼地」。</p><p class="ev-why"><span class="lbl">影响/解读</span>量大价低意味着后续存在价值重估空间，也提示国产算力商业化仍有提升潜力，是中长期主题。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article><article class="event"><h3 class="ev-title"><a href="https://wallstreetcn.com/" target="_blank" rel="noopener">AI 光模块新瓶颈：1.6T 卡在一颗小芯片上</a></h3><p class="ev-sum">华尔街见闻报道，AI 光模块向 1.6T 升级过程中，卡在某个关键小芯片（如 DSP/驱动等）环节，成为新的产业瓶颈。</p><p class="ev-why"><span class="lbl">影响/解读</span>瓶颈环节往往是价值与投资机会所在——利好能突破该环节的光芯片/器件厂商，也提示 CPO 等替代路线加速。</p><div class="ev-foot"><a class="src" href="https://wallstreetcn.com/" target="_blank" rel="noopener">华尔街见闻 ↗</a></div></article></section>

<script>
(function(){
  var WD=["周日","周一","周二","周三","周四","周五","周六"];
  function weekday(d){ try{ return WD[new Date(d+"T00:00:00").getDay()]; }catch(e){ return ""; } }
  // 收集报告
  var reports={ai:[],fin:[]};
  document.querySelectorAll("script.rpt").forEach(function(s){
    var tab=s.getAttribute("data-tab"), date=s.getAttribute("data-date");
    (reports[tab]=reports[tab]||[]).push({date:date, html:s.textContent.replace(/<\\\/script>/g,"<\/script>")});
  });
  Object.keys(reports).forEach(function(k){ reports[k].sort(function(a,b){ return a.date<b.date?1:-1; }); });

  var iframe=document.getElementById("view");
  var dnav=document.getElementById("dnav");
  var empty=document.getElementById("empty");
  var meta=document.getElementById("meta");
  var cur={tab:"ai", date:null};

  function showReport(tab,date){
    var list=reports[tab]||[], item=null;
    for(var i=0;i<list.length;i++){ if(list[i].date===date){ item=list[i]; break; } }
    if(!item){ iframe.hidden=true; empty.hidden=false; return; }
    empty.hidden=true; iframe.hidden=false;
    iframe.srcdoc=item.html;
    cur.date=date;
    meta.textContent=date+" · "+weekday(date);
    document.querySelectorAll(".di").forEach(function(b){
      b.setAttribute("aria-current", b.getAttribute("data-date")===date ? "true":"false");
    });
  }
  function buildDateNav(tab){
    var list=reports[tab]||[];
    dnav.innerHTML="";
    document.getElementById("sideTitle").textContent = list.length? "日期（"+list.length+"）":"日期";
    if(!list.length){ iframe.hidden=true; empty.hidden=false; meta.textContent=""; return; }
    list.forEach(function(it){
      var b=document.createElement("button");
      b.className="di "+tab; b.setAttribute("data-date",it.date);
      b.innerHTML='<span>'+it.date.slice(5)+'</span><span class="wd">'+weekday(it.date)+'</span>';
      b.addEventListener("click",function(){ showReport(tab,it.date); });
      dnav.appendChild(b);
    });
    showReport(tab, list[0].date);
  }
  function selectTab(tab){
    cur.tab=tab;
    document.querySelectorAll(".tab").forEach(function(t){
      t.setAttribute("aria-selected", t.getAttribute("data-tab")===tab ? "true":"false");
    });
    buildDateNav(tab);
  }
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click",function(){ selectTab(t.getAttribute("data-tab")); });
  });
  // 默认打开有报告的第一个分类
  selectTab((reports.ai&&reports.ai.length)?"ai":"fin");
})();
</script>
